{% extends 'index.html' %}

{% block blockname %}

<style>
    html,
    body {
        min-height: 100%;
        margin: 0;
        background-color: #020617;
    }

    .candidate-page,
    .candidate-page * {
        box-sizing: border-box;
    }

    .candidate-page {
        min-height: 100vh;
        max-width: 700px;
        margin: 0 auto;
        padding: 35px 16px;
        background-color: #020617;
        color: #e5e7eb;
        font-family: Tahoma, Arial, sans-serif;
    }

    .candidate-card {
        padding: 28px;
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .candidate-card h1 {
        margin: 0 0 8px;
        color: #f8fafc;
        text-align: center;
        font-size: 24px;
    }

    .description {
        margin: 0 0 24px;
        color: #94a3b8;
        text-align: center;
        font-size: 14px;
    }

    .form-fields p {
        margin: 0 0 18px;
    }

    .form-fields label {
        display: block;
        margin-bottom: 7px;
        color: #cbd5e1;
        font-size: 14px;
        font-weight: bold;
    }

    .form-fields input:not([type="checkbox"]):not([type="radio"]),
    .form-fields select,
    .form-fields textarea {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #334155;
        border-radius: 8px;
        background: #020617;
        color: #f8fafc;
        font: inherit;
        font-size: 14px;
    }

    .form-fields textarea {
        min-height: 110px;
        resize: vertical;
    }

    .form-fields input:focus,
    .form-fields select:focus,
    .form-fields textarea:focus {
        border-color: #60a5fa;
        outline: 2px solid rgba(96, 165, 250, 0.2);
    }

    .form-fields input[type="checkbox"],
    .form-fields input[type="radio"] {
        accent-color: #3b82f6;
    }

    .helptext {
        display: block;
        margin-top: 5px;
        color: #94a3b8;
        font-size: 12px;
    }

    .errorlist {
        margin: 7px 0 0;
        padding-right: 20px;
        color: #fca5a5;
        font-size: 13px;
    }

    .non-field-errors {
        margin-bottom: 16px;
        padding: 12px;
        border: 1px solid #7f1d1d;
        border-radius: 8px;
        background: #450a0a;
        color: #fecaca;
    }

    .form-actions {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 24px;
    }

    .button {
        display: inline-block;
        padding: 11px 20px;
        border: 0;
        border-radius: 8px;
        color: #fff;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
        transition: background-color 0.2s ease;
    }

    .submit-button {
        background: #2563eb;
    }

    .submit-button:hover {
        background: #1d4ed8;
    }

    .cancel-button {
        background: #334155;
    }

    .cancel-button:hover {
        background: #1e293b;
    }

    @media (max-width: 500px) {
        .candidate-card {
            padding: 20px 16px;
        }

        .form-actions {
            flex-direction: column;
        }

        .form-actions .button {
            width: 100%;
            text-align: center;
        }
    }
</style>

<main class="candidate-page">
    <section class="candidate-card">
        <h1>افزودن داوطلب</h1>
        <p class="description">اطلاعات داوطلب را در فرم زیر وارد کنید.</p>

        <form method="post" action="">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <div class="non-field-errors">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            <div class="form-fields">
                {{ form.as_p }}
            </div>

            <div class="form-actions">
                <button class="button submit-button" type="submit">
                    ثبت اطلاعات
                </button>

                <a class="button cancel-button" href="{% url 'main' %}">
                    بازگشت
                </a>
            </div>
        </form>
    </section>
</main>

{% endblock blockname %}
